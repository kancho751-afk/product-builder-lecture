
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Lotto Number Generator</h1>
            <p>Your lucky numbers are just a click away!</p>
        </header>
        <div class="controls">
            <label for="sets-select">Number of Sets:</label>
            <select id="sets-select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
            </select>
        </div>
        <div id="sets-container" class="sets-container">
            <!-- Number sets will be displayed here -->
        </div>
        <button id="generate-button">Generate Numbers</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
